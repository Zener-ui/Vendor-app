name: Fidelx Vendor Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'vendor/**'
      - '.github/workflows/vendor-android.yml'
  pull_request:
    paths:
      - 'vendor/**'
      - '.github/workflows/vendor-android.yml'

permissions:
  contents: read

jobs:
  build-vendor-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vendor/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prepare Capacitor Android project and Firebase config
        run: npm run android:prepare

      - name: Build debug APK
        working-directory: vendor/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload vendor APK
        uses: actions/upload-artifact@v4
        with:
          name: fidelx-vendor-debug-apk
          path: vendor/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
