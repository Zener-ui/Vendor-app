name: Build Fidelx Vendor Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Deliberately matches the working customer workflow's SDK setup.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ""

      - name: Verify vendor Firebase registration
        working-directory: vendor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('google-services.json', 'utf8'));
          const found = (config.client || []).some(c => c.client_info?.android_client_info?.package_name === 'com.fidelx.vendor');
          if (!found) {
            console.error('google-services.json does not contain com.fidelx.vendor');
            process.exit(1);
          }
          console.log('Vendor Firebase registration verified.');
          NODE

      - name: Install vendor dependencies
        working-directory: vendor
        run: npm install

      # Capacitor must be able to load capacitor.config.ts before `cap add android`.
      - name: Install TypeScript for Capacitor config
        working-directory: vendor
        run: npm install --save-dev typescript

      - name: Build Fidelx vendor web app
        working-directory: vendor
        env:
          VITE_API_URL: https://fidelx-backend.onrender.com/api
          VITE_APP_ROLE: vendor
        run: npm run build

      - name: Add Android platform
        working-directory: vendor
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: vendor
        run: npx cap sync android

      - name: Apply Fidelx vendor launcher icons
        working-directory: vendor
        shell: bash
        run: |
          set -euo pipefail
          test -f public/pwa-512x512.png
          res=android/app/src/main/res
          # Remove the Capacitor template's default (Android robot) launcher resources
          rm -f "$res"/drawable/ic_launcher_background.xml "$res"/drawable-v24/ic_launcher_foreground.xml "$res"/mipmap-*/ic_launcher*.webp
          cp -R android-icons/. "$res"/
          # Fail the build if the robot icon could still win
          grep -q '@mipmap/ic_launcher_foreground' "$res"/mipmap-anydpi-v26/ic_launcher.xml
          test -f "$res"/mipmap-xxxhdpi/ic_launcher_foreground.png
          grep -q 'FF6200' "$res"/values/ic_launcher_background.xml
          # Replace the template splash (the blank/Capacitor-logo screen shown while the app loads)
          find "$res" -name 'splash.png' -delete
          cp -R android-splash/. "$res"/
          test -f "$res"/drawable/splash.xml
          STYLES="$res/values/styles.xml"
          python3 - "$STYLES" <<'PYSTYLE'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          if p.exists():
              s = p.read_text()
              m = re.search(r'<style name="AppTheme\.NoActionBarLaunch"[^>]*parent="Theme\.SplashScreen"[^>]*>', s)
              if m and 'windowSplashScreenBackground' not in s:
                  s = s.replace(m.group(0), m.group(0) + '\n        <item name="windowSplashScreenBackground">@color/fidelx_splash_bg</item>', 1)
                  p.write_text(s)
                  print("Android 12+ splash background set.")
              else:
                  print("Android 12+ splash style left unchanged.")
          PYSTYLE
          echo "Fidelx vendor launcher icons installed."

      - name: Configure Firebase and vendor Android identity
        working-directory: vendor
        shell: bash
        run: |
          set -euo pipefail
          test -f google-services.json
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/build.gradle')
          app = Path('android/app/build.gradle')
          if not root.exists() or not app.exists():
              raise SystemExit('Generated Android Gradle files were not found')
          s = root.read_text()
          plugin = "classpath 'com.google.gms:google-services:4.4.2'"
          if 'com.google.gms:google-services' not in s:
              if 'dependencies {' not in s:
                  raise SystemExit('Root Gradle dependencies block not found')
              s = s.replace('dependencies {', 'dependencies {\n        ' + plugin, 1)
              root.write_text(s)
          s = app.read_text()
          if 'com.google.gms.google-services' not in s:
              s += '\n\napply plugin: "com.google.gms.google-services"\n'
              app.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'package="com.fidelx.vendor"' not in s:
              # Capacitor uses appId from capacitor.config; set namespace/applicationId in Gradle instead.
              pass
          for perm in ['android.permission.ACCESS_COARSE_LOCATION', 'android.permission.ACCESS_FINE_LOCATION', 'android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS', 'android.permission.CAMERA', 'android.permission.POST_NOTIFICATIONS']:
              line = f'<uses-permission android:name="{perm}" />'
              if line not in s:
                  s = s.replace('<application', f'    {line}\n    <application', 1)
          manifest.write_text(s)
          gradle = app.read_text()
          if 'applicationId "com.fidelx.vendor"' not in gradle and "applicationId 'com.fidelx.vendor'" not in gradle:
              import re
              gradle, n = re.subn(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "com.fidelx.vendor"', gradle, count=1)
              if n == 0:
                  raise SystemExit('Could not locate applicationId in generated app/build.gradle')
              app.write_text(gradle)
          print('Firebase Gradle plugin and vendor package configured.')
          PY

      - name: Build vendor debug APK
        working-directory: vendor/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload vendor APK
        uses: actions/upload-artifact@v4
        with:
          name: fidelx-vendor-debug-apk
          path: vendor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
